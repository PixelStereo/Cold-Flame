name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.sha }}
      version: snapshot-${{ github.sha }}
